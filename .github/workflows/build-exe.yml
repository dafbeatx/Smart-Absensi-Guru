name: Build Windows Desktop App (EXE)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows-exe:
    name: Build Windows EXE Installer
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🏗️ Build Web Assets
        env:
          VITE_PROVIDER: "supabase"
          VITE_SUPABASE_URL: "https://fwhdjqvtjzesbdcqorsn.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3aGRqcXZ0anplc2JkY3FvcnNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczNzAyNDgsImV4cCI6MjA4Mjk0NjI0OH0.jgKMD9Yg0iWw3JQMeH7_HQ3ZDOmYBqZ70Y-HZEjOyuY"
        run: npm run build

      - name: 💻 Compile Windows Executable (.exe)
        run: npx --yes electron-builder --win --config electron-builder.json

      - name: 📤 Upload Windows EXE Installers
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Absensi-Guru-Windows-EXE
          path: release/*.exe
