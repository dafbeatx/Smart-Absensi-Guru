
<!DOCTYPE html>
<html>

  h2 { font-size:36px; font-weight:600; color:#e0f2fe; margin:0 0 40px 0; max-width:1400px; line-height:1.4; }

</head>

  <div class="badge">Inovasi Digital Sekolah Mandiri</div>
